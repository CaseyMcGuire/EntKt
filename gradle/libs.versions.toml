[versions]
junit-jupiter-engine = "5.11.1"
kotlinpoet = "1.18.1"
# Compile-fail test harness (maintained fork of
# tschuchort's kotlin-compile-testing). Used by :schema's
# compile-fail tests to assert the typed query DSL rejects
# wrong-entity predicates / unauthorized @EntktInternal
# constructor calls at compile time.
kotlin-compile-testing = "0.5.1"
kotlinx-serialization = "1.9.0"
# Jackson databind + kotlin module for the opt-in JacksonJsonCodec (:jackson).
jackson = "2.18.2"
postgresql = "42.7.4"
testcontainers = "2.0.4"

[libraries]
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlin-compile-testing = { module = "dev.zacsweers.kctfork:core", version.ref = "kotlin-compile-testing" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.3.20" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.3.20" }
